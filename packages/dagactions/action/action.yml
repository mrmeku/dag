name: dagactions
description: Run a CI workflow as a dagraph DAG, with actions/cache restore and save and actions/upload-artifact as nodes in the graph.
inputs:
  workflow:
    description: Path to the workflow file that default-exports defineWorkflow(...)
    required: true
  cas-dir:
    description: Local content-addressed cache directory
    default: .dagactions/cas
  history-dir:
    description: Directory where each run records every settled node in a history of its own, for the post step
    default: .dagactions/history
  force:
    description: Ignore the cache for this run
    default: "false"
  only:
    description: Comma-separated nodes to run, with their dependencies and the post steps of what runs
runs:
  using: node24
  main: dist/main.js
  # At the end of the job, whatever became of main: the post steps a cancelled run did not reach.
  post: dist/post.js
