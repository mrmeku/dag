name: dagworkflows
description: Run a CI workflow as a dagraph DAG, with actions/cache restore and save and actions/upload-artifact as nodes in the graph.
inputs:
  workflow:
    description: Path to the workflow file that default-exports defineWorkflow(...)
    required: true
  cas-dir:
    description: Local content-addressed cache directory
    default: .dag/cas
  history-dir:
    description: Where each run records what started and settled, in a history of its own, for the post step
    default: .dag/history
  force:
    description: Ignore the cache for this run
    default: "false"
  only:
    description: Comma-separated nodes to run, with the post steps of what runs, each with its dependencies
runs:
  using: node24
  main: dist/main.js
  # At the end of the job, whatever became of main: the post steps the run still owes.
  post: dist/post.js
